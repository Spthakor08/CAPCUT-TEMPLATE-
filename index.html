<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP THAKOR EDITOR</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia, serif;
}

body{
background:#f3f3f3;
}

.top-header{
background:#222;
color:#fff;
text-align:center;
padding:25px;
}

.top-header h1{
font-size:32px;
}

.menu-bar{
background:#2b2b2b;
color:#fff;
padding:15px;
font-size:24px;
border-bottom:4px solid #c62828;
}

.menu-bar span{
font-size:18px;
margin-left:10px;
}

.search-box{
background:#fff;
margin:20px;
padding:20px;
border:1px solid #ddd;
}

.search-box input{
width:100%;
padding:15px;
font-size:18px;
border:1px solid #ccc;
}

.section-title{
text-align:center;
font-size:48px;
font-weight:bold;
margin:30px 0;
}

.posts{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
padding:15px;
}

.card{
background:#fff;
border:1px solid #ddd;
border-radius:5px;
overflow:hidden;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
padding:15px;
font-size:18px;
text-align:center;
line-height:1.5;
}

.btn{
display:block;
background:#ff9800;
color:#fff;
text-align:center;
padding:12px;
text-decoration:none;
font-weight:bold;
}

.footer{
margin-top:30px;
background:#222;
color:white;
text-align:center;
padding:20px;
}
</style>
</head>

<body>

<div class="top-header">
<h1>SP THAKOR EDITOR</h1>
<p>New Trending Templates & Editing Stock</p>
</div>

<div class="menu-bar">
☰ <span>Menu</span>
</div>

<div class="search-box">
<input type="text" placeholder="Search ...">
</div>

<div class="section-title">
Recent Posts
</div>

<div class="posts">

<div class="card">
<img src="https://picsum.photos/400/500?1">
<h3>Yeda Yung Marathi CapCut Template</h3>
<a href="#" class="btn">Use Template</a>
</div>

<div class="card">
<img src="https://picsum.photos/400/500?2">
<h3>Gori Mane Aave Teri Yaad CapCut Template</h3>
<a href="#" class="btn">Use Template</a>
</div>

<div class="card">
<img src="https://picsum.photos/400/500?3">
<h3>New Trending Beat Edit Template</h3>
<a href="#" class="btn">Use Template</a>
</div>

<div class="card">
<img src="https://picsum.photos/400/500?4">
<h3>Slow Motion Viral Template</h3>
<a href="#" class="btn">Use Template</a>
</div>

</div>

<div class="footer">
© 2026 SP THAKOR EDITOR
</div>

</body>
</html>
