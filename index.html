<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP THAKOR EDITOR</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f2f2}
.header{
background:#222;
color:#fff;
text-align:center;
padding:25px;
}
.header h1{font-size:34px}
.header p{margin-top:8px}

.nav{
background:#2b2b2b;
color:white;
padding:15px;
font-size:22px;
cursor:pointer;
border-bottom:3px solid red;
}

.menu{
display:none;
background:#fff;
padding:10px;
border-bottom:1px solid #ddd;
}

.menu a{
display:block;
padding:12px;
text-decoration:none;
color:#333;
}

.search-box{
padding:20px;
background:white;
margin:15px;
border:1px solid #ddd;
}

.search-box input{
width:100%;
padding:15px;
font-size:18px;
}

.title{
text-align:center;
font-size:40px;
font-weight:bold;
margin:20px;
}

.posts{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:6px;
overflow:hidden;
border:1px solid #ddd;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{
padding:12px;
text-align:center;
font-size:18px;
line-height:1.4;
}

.btn{
display:block;
text-align:center;
background:#ff9800;
color:white;
padding:12px;
text-decoration:none;
font-weight:bold;
}

.telegram{
position:fixed;
right:15px;
bottom:15px;
background:#0088cc;
color:white;
padding:12px 16px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}

@media(max-width:600px){
.posts{
grid-template-columns:1fr 1fr;
}
.title{
font-size:30px;
}
}
</style>
</head>

<body>

<div class="header">

</div>

<script>
function toggleMenu(){
var menu=document.getElementById("menu");
menu.style.display=menu.style.display==="block"?"none":"block";
}

function searchTemplates(){
let input=document.getElementById("search").value.toLowerCase();
let cards=document.querySelectorAll(".card");

cards.forEach(card=>{
let text=card.innerText.toLowerCase();
card.style.display=text.includes(input)?"block":"none";
});
}
</script>

</body>
